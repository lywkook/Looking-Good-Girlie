<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>減重計畫</title>
<!-- 加到手機主畫面後,像 App 一樣有圖示、全螢幕開啟 -->
<meta name="theme-color" content="#D2B4B7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="減重計畫">
<link rel="apple-touch-icon" href="assets/icon-180-2.png">
<link rel="icon" type="image/png" href="assets/icon-192-2.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F1EB;
    --card:#FCFAF6;
    --pink:#D2B4B7;
    --pink-soft:#EEE4E3;
    --peach:#DAC6B2;
    --mint:#BEC9BC;
    --mint-soft:#E9EDE7;
    --lav:#C3BDCB;
    --lav-soft:#EDE9F0;
    --ink:#5E554C;
    --ink-soft:#A69C90;
    --line:#EAE3D8;
    --shadow: 0 2px 6px rgba(94,85,76,0.05), 0 8px 18px rgba(195,189,203,0.08);
  }
  @font-face {
    font-family: 'RedBeanCream';
    src: url("assets/redbean-full.woff2") format("woff2"),
         url("assets/redbean-full.woff") format("woff");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--cream);
    color:var(--ink);
    font-family:"RedBeanCream", "Noto Sans TC", -apple-system, sans-serif;
    padding-bottom:60px;
    -webkit-font-smoothing:antialiased;
  }
  .cute{ font-family:"RedBeanCream", "ZCOOL KuaiLe", "Noto Sans TC", sans-serif; }

  .stamp-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:24px 20px 6px;
  }
  .stamp-row .brand{
    font-size:17.5px; letter-spacing:0.14em; color:var(--ink-soft);
  }
  .stamp-row .badge{
    font-size:17.5px; background:var(--pink); color:#fff; padding:3px 10px;
    border-radius:20px; font-weight:700;
  }

  header.hero{ padding:8px 20px 20px; position:relative; }
  .washi{
    position:absolute; top:-6px; left:24px; width:70px; height:20px;
    background:repeating-linear-gradient(45deg, var(--peach), var(--peach) 6px, #E7DDCE 6px, #E7DDCE 12px);
    opacity:0.85; transform:rotate(-4deg); border-radius:3px;
  }
  .hero h1{
    font-size:41.4px; line-height:1.35; margin:14px 0 6px; font-weight:400;
  }
  .hero .sub{ font-size:21.5px; color:var(--ink-soft); margin-bottom:16px; }

  .countdown-strip{ display:flex; gap:10px; }
  .metric{
    flex:1; background:var(--card); border-radius:18px; padding:12px 10px;
    box-shadow:var(--shadow); text-align:center; border:2px solid var(--pink-soft);
  }
  .metric .num{ font-size:31.7px; font-weight:900; color:var(--ink); }
  .metric .lbl{ font-size:16.7px; color:var(--ink-soft); margin-top:2px; }

  .section{ padding:22px 20px 0; }
  .section h2{
    font-size:25.5px; margin:0 0 12px; font-weight:400;
    display:flex; align-items:center; gap:6px;
  }
  .section h2 .dot{
    width:8px; height:8px; border-radius:50%; background:var(--pink); display:inline-block;
  }

  .weight-box{
    background:var(--card); border-radius:22px; padding:18px;
    box-shadow:var(--shadow); border:2px dashed var(--pink-soft);
  }
  .metric-inputs{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;
  }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:17.5px; color:var(--ink-soft); font-weight:700; padding-left:2px; }
  .field .wrap{ position:relative; }
  .field input{
    width:100%; padding:10px 12px; border-radius:12px; border:2px solid var(--line);
    font-size:23.1px; background:#FFFDFA; color:var(--ink);
  }
  .field input:focus{ outline:none; border-color:var(--pink); }
  .field .unit{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    font-size:17.5px; color:var(--ink-soft);
  }
  .save-btn{
    width:100%; background:var(--pink); color:#fff; border:none; border-radius:14px;
    padding:12px; font-size:23.8px; font-weight:700; letter-spacing:0.02em;
    box-shadow:0 4px 0 #B49599;
  }
  .save-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #B49599; }

  svg.chart{ width:100%; height:130px; display:block; margin-top:14px; }
  .chart-empty{ font-size:20.0px; color:var(--ink-soft); padding:14px 0 2px; text-align:center; }

  .snapshot-row{
    display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;
  }
  .chip{
    flex:1; min-width:70px; background:var(--mint-soft); border-radius:14px;
    padding:8px 10px; text-align:center;
  }
  .chip.pink{ background:var(--pink-soft); }
  .chip.lav{ background:var(--lav-soft); }
  .chip .v{ font-size:23.8px; font-weight:900; color:var(--ink); }
  .chip .k{ font-size:16.0px; color:var(--ink-soft); margin-top:1px; }

  .history{ margin-top:14px; }
  .history-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:20.0px; padding:7px 0; border-bottom:1px dashed var(--line);
    color:var(--ink-soft);
  }
  .history-row:last-child{ border-bottom:none; }
  .history-row b{ color:var(--ink); }

  .day-card{
    background:var(--card); border-radius:20px; margin-bottom:12px;
    box-shadow:var(--shadow); overflow:hidden; border:2px solid var(--line);
    position:relative;
  }
  .day-card.done{ border-color:var(--mint); }
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 15px; cursor:pointer;
  }
  .day-head .left{ display:flex; align-items:center; gap:9px; }
  .day-emoji{ font-size:30.2px; }
  .day-date{ font-size:23.1px; font-weight:700; }
  .day-idx{ font-size:16.7px; color:var(--ink-soft); }
  .day-tag{
    font-size:16.7px; font-weight:700; padding:3px 9px; border-radius:20px; color:#fff;
  }
  .tag-lift{ background:var(--pink); }
  .tag-cardio{ background:var(--peach); }
  .tag-rest{ background:var(--lav); }

  .check{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-size:20.7px; color:transparent;
  }
  .day-card.done .check{ background:var(--mint); border-color:var(--mint); color:#fff; }

  .day-body{ display:none; padding:0 15px 15px; font-size:21.5px; line-height:1.65; }
  .day-card.open .day-body{ display:block; }
  .day-body .blk{ margin-bottom:10px; }
  .day-body .blk-title{
    font-size:16.7px; color:var(--ink-soft); margin-bottom:3px; font-weight:700;
  }
  /* 今日菜單:餐別粗體、字放大 */
  #todayMenuBox .blk{ margin-bottom:14px; }
  #todayMenuBox .blk-title{ font-size:19px; color:var(--ink-soft); margin-bottom:4px; }
  #todayMenuBox .blk-title b{ font-weight:900; color:var(--ink); font-size:23px; }
  #todayMenuBox .editable-content{ font-size:23.5px; line-height:1.6; color:var(--ink); }

  .today-marker{
    font-size:15.1px; color:#fff; background:var(--pink); border-radius:20px;
    padding:2px 8px; margin-left:2px; font-weight:700;
  }

  .ex-row{
    display:flex; align-items:flex-start; gap:10px;
    background:#FFFBF6; border:2px solid var(--line); border-radius:14px;
    padding:9px 11px; margin-bottom:7px; cursor:pointer;
  }
  .ex-row.done{ background:var(--mint-soft); border-color:var(--mint); }
  .ex-check{
    width:22px; height:22px; min-width:22px; border-radius:50%; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:19.1px; color:transparent;
    background:#fff; margin-top:1px;
  }
  .ex-row.done .ex-check{ background:var(--mint); border-color:var(--mint); color:#fff; }
  .ex-text b{ font-size:21.5px; }
  .ex-detail{ font-size:20.0px; color:var(--ink-soft); margin-top:2px; line-height:1.5; }

  .food-card{
    display:flex; gap:10px; background:#FFFBF6; border:2px solid var(--line);
    border-radius:14px; padding:10px; margin-top:10px; align-items:flex-start;
  }
  .food-card img{ width:56px; height:56px; object-fit:cover; border-radius:10px; flex-shrink:0; }
  .food-card .fc-name{ font-size:22.3px; font-weight:700; }
  .food-card .fc-kcal{ font-size:20.7px; color:var(--pink); font-weight:900; }
  .food-card .fc-macro{ font-size:18.3px; color:var(--ink-soft); margin-top:2px; }
  .food-card .fc-note{ font-size:18.3px; color:var(--ink-soft); margin-top:3px; }
  .food-card .fc-del{ margin-left:auto; font-size:17.5px; color:var(--ink-soft); cursor:pointer; padding:2px 6px; }
  .kcal-total{
    display:inline-block; background:var(--pink-soft); border-radius:20px; padding:6px 16px;
    font-size:22.3px; font-weight:900; color:var(--ink);
  }
  .editable-wrap{ position:relative; }
  .edit-pencil{
    font-size:17.5px; color:var(--ink-soft); cursor:pointer; margin-left:6px; user-select:none;
  }
  [contenteditable="true"]{
    outline:2px dashed var(--pink); border-radius:8px; padding:3px 5px; background:#FFFDF8;
  }

  .footnote{
    padding:26px 20px 10px; font-size:19.1px; color:var(--ink-soft); line-height:1.75;
  }
  /* 飲食紀錄 · 熱量 */
  .meal-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .meal-tab{ flex:1; padding:9px 0; border:none; border-radius:12px; background:var(--pink-soft);
    color:var(--ink-soft); font-weight:700; font-size:17.6px; font-family:inherit; cursor:pointer; }
  .meal-tab.active{ background:var(--pink); color:#fff; }
  .food-input-row{ display:flex; gap:8px; margin-bottom:10px; }
  .food-input-row .fname{ flex:1; min-width:0; padding:10px 12px; border-radius:12px; border:2px solid var(--line);
    font-size:19.5px; background:#FFFDFA; color:var(--ink); font-family:inherit; }
  .kwrap{ position:relative; flex:none; }
  .kwrap input{ width:120px; padding:10px 44px 10px 12px; border-radius:12px; border:2px solid var(--line);
    font-size:19.5px; background:#FFFDFA; color:var(--ink); font-family:inherit; text-align:right; }
  .food-input-row .fname:focus, .kwrap input:focus, .target-row input:focus{ outline:none; border-color:var(--pink); }
  .kwrap .unit{ position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:14.7px; color:var(--ink-soft); }
  .target-row{ display:flex; align-items:center; justify-content:space-between; margin:16px 0 6px;
    font-size:18.5px; color:var(--ink-soft); font-weight:700; }
  .kcal-head{ display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; gap:8px; }
  .kcal-head .big{ font-size:29.3px; font-weight:900; color:var(--ink); }
  .kcal-head .sub{ font-size:16.6px; color:var(--ink-soft); }
  .kcal-bar{ height:14px; border-radius:10px; background:var(--pink-soft); overflow:hidden; margin:8px 0 2px; }
  .kcal-bar > span{ display:block; height:100%; border-radius:10px; background:var(--pink); }
  .kcal-bar.over > span{ background:#CDA9A2; }
  .advice{ background:var(--mint-soft); border-radius:16px; padding:12px 14px; margin:12px 0 2px;
    font-size:17.6px; line-height:1.65; color:var(--ink); }
  .advice.over{ background:#EFE6E1; }
  .advice.warn{ background:var(--lav-soft); }
  .meal-group{ margin-top:14px; }
  .meal-group-title{ font-size:16.6px; font-weight:900; color:var(--pink); margin-bottom:2px; }
  .field select{
    width:100%; padding:10px 12px; border-radius:12px; border:2px solid var(--line);
    font-size:23.1px; background:#FFFDFA; color:var(--ink); font-family:inherit;
    -webkit-appearance:none; appearance:none;
  }
  .field select:focus{ outline:none; border-color:var(--pink); }
  #pfToggle, #mxToggle{ cursor:pointer; user-select:none; }
  .pf-caret{ margin-left:auto; font-size:0.8em; color:var(--ink-soft); }
  .pf-mini{ display:none; }
  .section.collapsed .weight-box{ display:none; }
  .section.collapsed .pf-mini{
    display:block; background:var(--card); border-radius:16px; padding:12px 16px;
    box-shadow:var(--shadow); font-size:20.7px; color:var(--ink); cursor:pointer;
  }
  .pf-hint{ color:var(--ink-soft); }
  .food-suggest{ display:none; margin:-4px 0 10px; border:2px solid var(--line);
    border-radius:12px; overflow:hidden; background:var(--card); box-shadow:var(--shadow); }
  .food-suggest.show{ display:block; }
  .food-suggest .fs-item{ display:flex; justify-content:space-between; gap:10px;
    padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; font-size:20.7px; color:var(--ink); }
  .food-suggest .fs-item:last-child{ border-bottom:none; }
  .food-suggest .fs-item:active{ background:var(--pink-soft); }
  .food-suggest .fs-k{ color:var(--ink-soft); white-space:nowrap; }
  .plan-bar{ display:flex; justify-content:center; padding:12px 20px 2px; }
  .plan-current{ background:var(--pink-soft); color:var(--ink); border:none; border-radius:20px;
    padding:8px 20px; font-size:20.7px; font-weight:700; cursor:pointer; font-family:inherit; }
  .plan-panel{ display:none; margin:8px 20px 0; background:var(--card); border-radius:18px;
    box-shadow:var(--shadow); padding:14px; }
  .plan-panel.show{ display:block; }
  .plan-item{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; cursor:pointer; }
  .plan-item.active{ background:var(--pink-soft); }
  .plan-item .pi-name{ flex:1; font-weight:700; font-size:20.7px; color:var(--ink); }
  .plan-item .pi-type{ font-size:16.1px; color:var(--ink-soft); }
  .plan-item .pi-edit{ font-size:16.1px; color:var(--pink); padding:2px 8px; }
  .plan-item .pi-del{ font-size:16.1px; color:var(--ink-soft); padding:2px 8px; }
  .plan-new{ margin-top:10px; border-top:1px dashed var(--line); padding-top:12px; display:flex; flex-direction:column; gap:8px; }
  .plan-new input, .plan-new select{ padding:10px 12px; border-radius:12px; border:2px solid var(--line);
    font-size:20.7px; background:#FFFDFA; color:var(--ink); font-family:inherit; }
  #planHeader{ padding:14px 20px 0; margin:0; font-size:27.6px; }
  .mini-btn{ background:var(--mint-soft); color:var(--ink); border:none; border-radius:12px;
    padding:8px 14px; font-size:18.4px; font-family:inherit; cursor:pointer; }
  .food-photo-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  #foodPhotoPreview{ display:inline-flex; align-items:center; gap:6px; }
  .food-thumb-prev{ width:44px; height:44px; object-fit:cover; border-radius:8px; }
  .pp-x{ color:var(--ink-soft); cursor:pointer; font-size:20.7px; padding:0 4px; }
  .ai-photo-box{ background:var(--mint-soft); border-radius:16px; padding:14px; margin:14px 0; }
  .ai-photo-title{ font-size:19px; font-weight:900; color:var(--ink); margin-bottom:10px; }
  .ai-badge{ background:var(--mint); color:#fff; font-size:12.5px; font-weight:900; padding:2px 8px; border-radius:10px; vertical-align:middle; margin-left:4px; }
  .ai-photo-btn{ width:100%; background:var(--mint); color:#fff; border:none; border-radius:14px;
    padding:13px; font-size:18.5px; font-weight:900; font-family:inherit; cursor:pointer; box-shadow:0 4px 0 #A7B4A4; }
  .ai-photo-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #A7B4A4; }
  .ai-photo-btn:disabled{ opacity:.6; cursor:default; }
  .ai-photo-status{ font-size:17px; color:var(--ink); margin-top:10px; text-align:center; min-height:1px; }
  .ai-photo-status .ok{ color:var(--ink); font-weight:900; }
  .ai-photo-status .err{ color:#B5766F; }
  .ai-spin{ display:inline-block; width:16px; height:16px; border:3px solid var(--mint); border-top-color:transparent;
    border-radius:50%; animation:aispin .8s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes aispin{ to{ transform:rotate(360deg); } }
  .ai-key-toggle{ display:inline-block; margin-top:10px; font-size:15.5px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; }
  .ai-key-row{ display:none; gap:8px; margin-top:10px; }
  .ai-key-row.show{ display:flex; }
  .ai-key-row input{ flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; font-size:16px; font-family:inherit; background:#fff; color:var(--ink); }
  .ai-key-hint{ font-size:14.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5; }
  .ai-key-hint a{ color:var(--mint); font-weight:900; }
  .menu-regen-box{ display:none; margin-top:12px; padding:14px; background:var(--mint-soft); border-radius:16px; }
  .menu-regen-box.show{ display:block; }
  .menu-regen-box input{ width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:12px;
    padding:11px 13px; font-size:18px; font-family:inherit; background:#fff; color:var(--ink); }
  .wo-field{ margin:12px 0; }
  .wo-field label{ display:block; font-size:16.5px; color:var(--ink-soft); margin-bottom:6px; }
  .wo-textarea{ width:100%; box-sizing:border-box; min-height:78px; border:1.5px solid var(--line); border-radius:14px;
    padding:11px 13px; font-size:18px; font-family:inherit; background:#fff; color:var(--ink); line-height:1.5; resize:vertical; }
  .wo-hint{ font-size:15px; color:var(--ink-soft); margin:10px 0; line-height:1.5; }
  .wo-hint.err{ color:#B5766F; }
  .wo-week{ margin-top:12px; }
  .wo-day{ background:#FFFBF6; border:2px solid var(--line); border-radius:14px; padding:11px 13px; margin-bottom:9px; }
  .wo-day-h{ font-size:20px; margin-bottom:5px; }
  .wo-day-h b{ font-weight:900; color:var(--ink); }
  .wo-items{ margin:0; padding-left:20px; }
  .wo-items li{ font-size:18.5px; color:var(--ink); line-height:1.55; margin-bottom:2px; }
  .water-row{ display:flex; align-items:center; justify-content:center; gap:20px; }
  .water-btn{ width:56px; height:56px; border-radius:50%; border:none; background:var(--lav-soft);
    color:var(--ink); font-size:30px; font-weight:900; cursor:pointer; font-family:inherit; line-height:1; }
  .water-btn:active{ transform:scale(0.94); }
  .water-count{ font-size:26px; font-weight:900; color:var(--ink); min-width:130px; text-align:center; }
  .water-cups{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:14px 0 4px; }
  .water-cups .cup{ width:24px; height:30px; border-radius:5px 5px 10px 10px; border:2px solid var(--lav); background:transparent; }
  .water-cups .cup.full{ background:var(--lav); }
  .water-ml{ text-align:center; color:var(--ink-soft); font-size:18px; }
</style>
</head>
<body>

<div class="plan-bar">
  <button id="planCurrent" class="plan-current cute">減重計畫 ▾</button>
</div>
<div class="plan-panel" id="planPanel">
  <div class="plan-list" id="planList"></div>
  <div class="plan-new">
    <div style="font-size:18.4px;color:var(--ink-soft);font-weight:700;">新增計畫</div>
    <input id="newPlanName" placeholder="計畫名稱(例:長期體重紀錄)" autocomplete="off">
    <select id="newPlanType">
      <option value="track">紀錄飲食 + 喝水 + 體重</option>
      <option value="full">幫我規劃減重減脂</option>
    </select>
    <button id="addPlanBtn" class="save-btn cute">＋ 建立新計畫</button>
  </div>
</div>
<h2 class="cute" id="planHeader" style="display:none;"></h2>

<div class="stamp-row">
  <div class="brand cute">🍑 TRAINING DIARY</div>
  <div class="badge" id="todayLabel">--</div>
</div>

<header class="hero" id="heroSection">
  <div class="washi"></div>
  <h1 class="cute">64kg → 60kg 大作戰</h1>
  <div class="countdown-strip">
    <div class="metric">
      <div class="num" id="daysLeft">--</div>
      <div class="lbl">剩餘天數 ⏳</div>
    </div>
    <div class="metric">
      <div class="num" id="doneCount">0/0</div>
      <div class="lbl">完成天數 ✅</div>
    </div>
    <div class="metric">
      <div class="num" id="latestWeight">--</div>
      <div class="lbl">最新體重 ⚖️</div>
    </div>
  </div>
</header>

<div class="section" id="menuSection">

<script>
(function(){
  // 若執行環境沒有提供 window.storage(例如直接用手機/瀏覽器打開這個檔案),
  // 就用瀏覽器內建的 localStorage 當備援,讓體重、飲食、打卡等資料一樣能永久存下來。
  if(!window.storage){
    window.storage = {
      get: function(key){
        try{ const v = localStorage.getItem(key); return v===null ? null : {value:v}; }
        catch(e){ return null; }
      },
      set: function(key, value){
        try{ localStorage.setItem(key, value); }catch(e){}
      },
      list: function(prefix){
        try{
          const keys = [];
          for(let i=0;i<localStorage.length;i++){
            const k = localStorage.key(i);
            if(k && k.indexOf(prefix)===0) keys.push(k);
          }
          return { keys: keys };
        }catch(e){ return { keys: [] }; }
      }
    };
  }

  let PLAN = null; let plans = [];
  function K(base){ return (PLAN && PLAN.id!=="default") ? ("p:"+PLAN.id+":"+base) : base; }

  const startDate = new Date(2026,6,20);
  const endDate = new Date(2026,7,28);
  const today = new Date(2026,6,20);

  const proteinRotation = [
    {name:"雞肉", note:"雞胸或雞腿肉,約掌心大小,用煎或烤"},
    {name:"鱸魚", note:"清蒸或煎,搭配薑絲蔥段"},
    {name:"牛肉片", note:"燙牛肉片或快炒,少油"},
    {name:"蝦仁", note:"蒜炒蝦仁或清燙"},
    {name:"牛排", note:"約手掌大小一片,煎至七分熟以下,搭配大量蔬菜"},
    {name:"韓式嫩豆腐鍋", note:"豆腐+蛋+蔬菜,清淡版少油少辣,湯喝一半就好(鈉偏高)"}
  ];
  const fruitRotation = ["蕃茄","橘子","蘋果"];
  const weekdayNames = ["日","一","二","三","四","五","六"];

  function fmtDate(d){ return (d.getMonth()+1)+"/"+d.getDate(); }
  function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  // 重訓日依照妳常看的教學影片,輪流練 4 個部位:肩膀、大腿內側、手臂(二頭)、拜拜肉(三頭+背)
  const liftPrograms = [
    { target:"肩膀(直角肩)", exercises:[
        {name:"啞鈴肩推", detail:"站姿或坐姿,啞鈴舉高過頭再慢慢放下,4 組 x 12-15 下"},
        {name:"啞鈴側平舉", detail:"手臂打直,左右手同時側舉到肩膀高度再放下,4 組 x 15 下,練出肩膀的線條"}
      ]},
    { target:"大腿內側(緊實)", exercises:[
        {name:"相撲深蹲", detail:"雙腳打開比肩寬、腳尖朝外,雙手抱著一顆啞鈴放身前蹲下再站起,4 組 x 15 下,重點是感受大腿內側在出力"},
        {name:"側向弓步", detail:"往左右輪流跨一大步蹲下,啞鈴抱胸前輔助平衡,每邊 4 組 x 12 下"}
      ]},
    { target:"手臂塑形(二頭肌)", exercises:[
        {name:"啞鈴二頭彎舉", detail:"手肘固定貼緊身體兩側,啞鈴往上彎舉到肩膀再放下,4 組 x 15 下"},
        {name:"交替彎舉", detail:"左右手輪流彎舉,可以撐比較久也比較不會手痠到做不下去,4 組 x 12 下(每邊)"}
      ]},
    { target:"減拜拜肉(三頭+背)", exercises:[
        {name:"啞鈴划船", detail:"上半身往前傾、背打直,啞鈴往腰間拉再放下,4 組 x 15 下,練上背也順便練到拜拜肉"},
        {name:"啞鈴三頭屈臂伸", detail:"手肘朝上固定在耳朵旁,啞鈴在腦後伸直手臂再彎回來,4 組 x 15 下,專門對付拜拜肉"}
      ]}
  ];

  // 燃脂日:不用啞鈴,靠心跳加快、動作連續來燃脂,對應妳平常看的全身燃脂教學
  const cardioExercises = [
    {name:"開合跳", detail:"手腳同時打開再合起來,像做熱身操,40 秒 x 3 組"},
    {name:"原地高抬腿", detail:"膝蓋盡量抬高,像在原地快跑,40 秒 x 3 組"},
    {name:"登山跑(棒式抬膝)", detail:"維持棒式姿勢,左右膝蓋輪流往胸口收,40 秒 x 3 組"},
    {name:"深蹲(或深蹲跳)", detail:"蹲下再站起或往上跳起,落地緩衝,40 秒 x 3 組(膝蓋不舒服就做一般深蹲不跳)"}
  ];

  function workoutForWeekday(wd, liftCounter){
    if(wd===0) return {type:"rest", emoji:"🌙", title:"休息 / 散步", note:"完全休息或飯後散步 20-30 分鐘,讓身體修復,這天不用啞鈴也不用跑步機。",
      exercises:[{name:"散步(選擇性)", detail:"想動一下就飯後散步 20-30 分鐘,不想動也可以完全休息"}]};
    if(wd===1 || wd===3 || wd===5){
      const p = liftPrograms[liftCounter % liftPrograms.length];
      return {type:"lift", emoji:"💪", title:"啞鈴重訓:" + p.target,
        note:"用手邊 3/5/8 磅啞鈴,盡量選讓最後 2 下有點吃力的磅數,才練得到效果。",
        exercises: p.exercises.concat([{name:"核心收尾", detail:"棒式 3 組 x 30-45 秒 + 捲腹 3 組 x 15 下"}])};
    }
    return {type:"cardio", emoji:"🏃‍♀️", title:"跑步機間歇 + 全身燃脂",
      note:"「燃脂」白話說就是讓心跳加快、有點喘又能撐住的連續動作,不需要啞鈴,重點是動作不要停、休息時間不要拉太長。",
      exercises: [{name:"跑步機間歇", detail:"快走 2 分鐘、慢跑或加速走 1 分鐘,重複 7-8 輪,共 20-25 分鐘"}].concat(cardioExercises)};
  }

  // 只寫「吃什麼」,對應 proteinRotation 順序:雞肉/鱸魚/牛肉片/蝦仁/牛排/嫩豆腐鍋
  const lunchText = [
    "雞胸肉(或雞腿) + 白飯一碗 + 炒青菜",
    "清蒸鱸魚 + 白飯 + 燙青菜",
    "燙牛肉片 + 白飯一碗 + 青菜",
    "蒜炒蝦仁 + 白飯 + 蔬菜",
    "煎牛排一片 + 白飯一碗 + 大量蔬菜",
    "韓式嫩豆腐鍋 + 白飯"
  ];
  const dinnerText = [
    "雞肉 + 蔬菜{carb}",
    "清蒸鱸魚 + 蔬菜{carb}",
    "牛肉片炒蔬菜{carb}",
    "蝦仁 + 蔬菜{carb}",
    "牛排(份量小) + 大量蔬菜{carb}",
    "嫩豆腐鍋{carb}"
  ];

  function dietForDay(idx){
    const lunchIdx = idx % 6;
    const dinnerIdx = (idx + 3) % 6;
    const fruit = fruitRotation[idx % fruitRotation.length];
    const cornDay = (idx % 4 === 3);
    const carb = cornDay ? " + 玉米" : " + 半碗飯";
    return {
      breakfast: "水煮蛋 1 顆",
      lunch: lunchText[lunchIdx],
      dinner: dinnerText[dinnerIdx].replace("{carb}", carb),
      fruit: fruit + " 一份"
    };
  }

  const days = [];
  let cur = new Date(startDate);
  let i = 0;
  let liftCounter = 0;
  while(cur <= endDate){
    const wd = cur.getDay();
    const workout = workoutForWeekday(wd, liftCounter);
    if(workout.type==="lift") liftCounter++;
    days.push({ idx:i+1, date:new Date(cur), iso:isoDate(cur), weekdayLabel:weekdayNames[wd],
      workout, diet:dietForDay(i) });
    cur.setDate(cur.getDate()+1); i++;
  }

  document.getElementById("todayLabel").textContent = fmtDate(today) + " 今天";
  const msPerDay = 1000*60*60*24;
  document.getElementById("daysLeft").textContent = Math.max(0, Math.round((endDate - today)/msPerDay));

  // ---------- 今日菜單(一打開就看得到,不用點開,也可以直接編輯) ----------
  function renderTodayMenu(){
    const todayIso = isoDate(today);
    const todayEntry = days.find(d=>d.iso===todayIso) || days[0];
    const box = document.getElementById("todayMenuBox");
    const fields = [["breakfast","早餐"],["lunch","午餐"],["dinner","晚餐"],["fruit","水果點心"]];
    box.innerHTML = fields.map(([f,label],i)=>`
      <div class="blk" style="${i===fields.length-1?'margin-bottom:0;':''}">
        <div class="blk-title"><b style="font-weight:900;">${label}</b> <span class="edit-pencil" data-field="${f}" data-iso="${todayEntry.iso}">✏️</span></div>
        <div class="editable-content" data-field="${f}" data-iso="${todayEntry.iso}">${todayEntry.diet[f]}</div>
      </div>`).join("");
    box.querySelectorAll(".edit-pencil").forEach(p=>{
      p.addEventListener("click", ()=>{
        const el = box.querySelector(`.editable-content[data-field="${p.dataset.field}"]`);
        el.contentEditable = "true"; el.focus();
        document.getSelection().selectAllChildren(el);
      });
    });
    box.querySelectorAll(".editable-content").forEach(el=>{
      el.addEventListener("blur", async ()=>{
        el.contentEditable = "false";
        const field = el.dataset.field, iso = el.dataset.iso;
        const val = el.textContent.trim();
        todayEntry.diet[field] = val;
        try{ await window.storage.set("dietover:"+iso+":"+field, val, false); }catch(e){}
        renderDays(); // 同步更新下方每日清單裡的文字
      });
    });
  }

  // ---------- 換今日菜單(不想吃就選想吃的、重新給一份) ----------
  let menuVariant = 0;
  function applyMenu(menu){
    const iso = isoDate(today);
    const te = days.find(d=>d.iso===iso) || days[0];
    ["breakfast","lunch","dinner","fruit"].forEach(f=>{
      if(menu[f]!=null && String(menu[f]).trim()){
        te.diet[f] = String(menu[f]).trim();
        try{ window.storage.set("dietover:"+iso+":"+f, te.diet[f], false); }catch(e){}
      }
    });
    renderTodayMenu(); renderDays();
  }
  function localNewMenu(){
    const iso = isoDate(today);
    const te = days.find(d=>d.iso===iso) || days[0];
    menuVariant++;
    return dietForDay((te.idx - 1) + menuVariant);  // 換一個輪替組合(不同蛋白質/澱粉)
  }
  async function regenMenu(){
    const status = document.getElementById("menuRegenStatus");
    const wish = (document.getElementById("menuWish").value||"").trim();
    if(!geminiKey){
      applyMenu(localNewMenu());
      status.innerHTML = '<span class="ok">已換一份 ✅</span>' + (wish ? ' <span style="color:var(--ink-soft);font-size:14.5px">想精準指定「'+esc(wish)+'」需到下方「飲食紀錄」貼上免費 AI 金鑰</span>' : '');
      return;
    }
    const btn = document.getElementById("menuGenBtn"); const old = btn.textContent;
    btn.disabled = true; btn.textContent = "產生中…";
    status.innerHTML = '<span class="ai-spin"></span>重新設計中…';
    try{
      const target = parseInt(document.getElementById("inKcalTarget").value,10) || kcalTarget || 1500;
      const prompt = '你是營養師,幫正在減重的人重新設計「今天一天」的菜單。'
        + '每日熱量目標約 '+target+' 大卡,以原型食物、好準備為主。'
        + '使用者的需求 / 想吃的:'+(wish || '沒特別指定,給清爽好準備的')+'。'
        + '冰箱可能有:牛排、雞肉、鱸魚、牛肉片、蝦仁、豆腐、白飯、白麵、蔬菜、蕃茄橘子蘋果玉米(不一定要全用,想吃外食也可以)。'
        + '只回傳 JSON,每一項「只寫吃什麼」、不要說明或理由、不超過 25 字,格式:{"breakfast":"...","lunch":"...","dinner":"...","fruit":"..."}。';
      const m = await geminiJSON(prompt, null, 0.6);
      if(!m || !m.lunch) throw new Error("回傳格式看不懂");
      applyMenu(m);
      status.innerHTML = '<span class="ok">新菜單好了 ✅ 已套用到上面</span>';
    }catch(e){
      applyMenu(localNewMenu());
      status.innerHTML = '<span class="err">AI 失敗('+esc(e.message||e)+'),先幫你換一種現成組合。</span>';
    }
    btn.disabled = false; btn.textContent = old;
  }
  function initMenuModule(){

  const listEl = document.getElementById("dayList");
  const doneState = {};
  const exerciseDone = {};

  function tagFor(type){
    if(type==="lift") return '<span class="day-tag tag-lift">重訓</span>';
    if(type==="cardio") return '<span class="day-tag tag-cardio">燃脂</span>';
    return '<span class="day-tag tag-rest">休息</span>';
  }

  function renderDays(){
    listEl.innerHTML = "";
    days.forEach(day=>{
      const card = document.createElement("div");
      card.className = "day-card" + (doneState[day.iso] ? " done" : "");
      const isToday = isoDate(today) === day.iso;
      const exRows = day.workout.exercises.map((ex,exi)=>{
        const exKey = "ex:"+day.iso+":"+exi;
        const checked = !!exerciseDone[exKey];
        return `
        <div class="ex-row${checked?' done':''}" data-exkey="${exKey}">
          <div class="ex-check">✓</div>
          <div class="ex-text"><b>${ex.name}</b> <span class="edit-pencil" data-exedit="${day.iso}:${exi}">✏️</span>
            <div class="ex-detail" data-exedit-content="${day.iso}:${exi}">${ex.detail}</div></div>
        </div>`;
      }).join("");
      const dietFields = [["breakfast","早餐"],["lunch","午餐"],["dinner","晚餐"],["fruit","水果點心"]];
      const dietBlocks = dietFields.map(([f,label])=>`
        <div class="blk"><div class="blk-title">${label} <span class="edit-pencil" data-field="${f}" data-iso="${day.iso}">✏️</span></div>
        <div class="editable-content" data-field="${f}" data-iso="${day.iso}">${day.diet[f]}</div></div>`).join("");
      card.innerHTML = `
        <div class="day-head">
          <div class="left">
            <span class="day-emoji">${day.workout.emoji}</span>
            <span class="day-date">${fmtDate(day.date)}(${day.weekdayLabel})</span>
            ${tagFor(day.workout.type)}
            ${isToday ? '<span class="today-marker">今天</span>' : ''}
          </div>
          <div class="check">✓</div>
        </div>
        <div class="day-body">
          <div class="blk">
            <div class="blk-title">運動:${day.workout.title}</div>
            <div style="color:var(--ink-soft); margin-bottom:8px;">${day.workout.note}</div>
            ${exRows}
          </div>
          ${dietBlocks}
        </div>
      `;
      const head = card.querySelector(".day-head");
      const checkEl = card.querySelector(".check");
      head.addEventListener("click", (e)=>{ if(e.target===checkEl || e.target.classList.contains('edit-pencil')) return; card.classList.toggle("open"); });
      checkEl.addEventListener("click", async (e)=>{
        e.stopPropagation();
        doneState[day.iso] = !doneState[day.iso];
        card.classList.toggle("done");
        try{ await window.storage.set("dayplan:"+day.iso, doneState[day.iso] ? "1":"0", false); }catch(err){}
        updateDoneCount();
      });
      card.querySelectorAll(".ex-row").forEach(row=>{
        row.addEventListener("click", async (e)=>{
          if(e.target.classList.contains('edit-pencil') || e.target.hasAttribute('data-exedit-content')) return;
          e.stopPropagation();
          const key = row.dataset.exkey;
          exerciseDone[key] = !exerciseDone[key];
          row.classList.toggle("done");
          try{ await window.storage.set(key, exerciseDone[key] ? "1":"0", false); }catch(err){}
        });
      });
      card.querySelectorAll(".edit-pencil[data-exedit]").forEach(p=>{
        p.addEventListener("click", (e)=>{
          e.stopPropagation();
          const [iso, exi] = p.dataset.exedit.split(":");
          const el = card.querySelector(`[data-exedit-content="${iso}:${exi}"]`);
          el.contentEditable = "true"; el.focus();
          document.getSelection().selectAllChildren(el);
        });
      });
      card.querySelectorAll("[data-exedit-content]").forEach(el=>{
        el.addEventListener("blur", async (e)=>{
          e.stopPropagation();
          el.contentEditable = "false";
          const [iso, exiStr] = el.dataset.exeditContent.split(":");
          const exi = parseInt(exiStr,10);
          const val = el.textContent.trim();
          const d = days.find(x=>x.iso===iso);
          if(d) d.workout.exercises[exi].detail = val;
          try{ await window.storage.set("exover:"+iso+":"+exi, val, false); }catch(err){}
        });
        el.addEventListener("click", (e)=>e.stopPropagation());
      });
      card.querySelectorAll(".edit-pencil[data-field]").forEach(p=>{
        p.addEventListener("click", (e)=>{
          e.stopPropagation();
          const el = card.querySelector(`.editable-content[data-field="${p.dataset.field}"][data-iso="${p.dataset.iso}"]`);
          el.contentEditable = "true"; el.focus();
          document.getSelection().selectAllChildren(el);
        });
      });
      card.querySelectorAll(".editable-content").forEach(el=>{
        el.addEventListener("click", (e)=>e.stopPropagation());
        el.addEventListener("blur", async ()=>{
          el.contentEditable = "false";
          const field = el.dataset.field, iso = el.dataset.iso;
          const val = el.textContent.trim();
          const d = days.find(x=>x.iso===iso);
          if(d) d.diet[field] = val;
          try{ await window.storage.set("dietover:"+iso+":"+field, val, false); }catch(err){}
          if(iso === isoDate(today)) renderTodayMenu();
        });
      });
      listEl.appendChild(card);
    });
    updateDoneCount();
  }

  function updateDoneCount(){
    const doneN = Object.values(doneState).filter(Boolean).length;
    document.getElementById("doneCount").textContent = doneN + "/" + days.length;
  }

  async function loadOverrides(){
    try{
      const keys = await window.storage.list("dietover:", false);
      if(keys && keys.keys){
        for(const k of keys.keys){
          try{
            const r = await window.storage.get(k, false);
            if(!r) continue;
            const rest = k.replace("dietover:","");
            const lastColon = rest.lastIndexOf(":");
            const iso = rest.slice(0,lastColon), field = rest.slice(lastColon+1);
            const d = days.find(x=>x.iso===iso);
            if(d) d.diet[field] = r.value;
          }catch(e){}
        }
      }
    }catch(e){}
    try{
      const exKeys = await window.storage.list("exover:", false);
      if(exKeys && exKeys.keys){
        for(const k of exKeys.keys){
          try{
            const r = await window.storage.get(k, false);
            if(!r) continue;
            const rest = k.replace("exover:","");
            const lastColon = rest.lastIndexOf(":");
            const iso = rest.slice(0,lastColon), exi = parseInt(rest.slice(lastColon+1),10);
            const d = days.find(x=>x.iso===iso);
            if(d && d.workout.exercises[exi]) d.workout.exercises[exi].detail = r.value;
          }catch(e){}
        }
      }
    }catch(e){}
  }

  async function loadDoneState(){
    try{
      const keys = await window.storage.list("dayplan:", false);
      if(keys && keys.keys){
        for(const k of keys.keys){
          try{ const r = await window.storage.get(k, false); if(r) doneState[k.replace("dayplan:","")] = r.value==="1"; }catch(e){}
        }
      }
    }catch(e){}
    try{
      const exKeys = await window.storage.list("ex:", false);
      if(exKeys && exKeys.keys){
        for(const k of exKeys.keys){
          try{ const r = await window.storage.get(k, false); if(r) exerciseDone[k] = r.value==="1"; }catch(e){}
        }
      }
    }catch(e){}
    renderDays();
  }

  let log = []; // [{date, weight, fat, bmi, muscle}]

  async function loadLog(){
    log = [];
    try{
      const r = await window.storage.get(K("metricslog"), false);
      if(r && r.value) log = JSON.parse(r.value);
    }catch(e){ log = []; }

  async function saveLog(){

  function renderMetrics(){
    drawChart();
    drawSnapshot();
    drawHistory();
    updateMxMini();
  }
  function updateMxMini(){
    const mini = document.getElementById("mxMini");
    if(!mini) return;
    if(log && log.length){
      const sorted = [...log].sort((a,b)=>a.date.localeCompare(b.date));
      const l = sorted[sorted.length-1];
      let s = `最新 <b>${l.weight}</b>kg`;
      if(l.fat) s += ` · 體脂 ${l.fat}%`;
      if(l.muscle) s += ` · 肌肉 ${l.muscle}kg`;
      mini.innerHTML = s + ` <span class="pf-hint">(點這裡展開)</span>`;
    } else {
      mini.innerHTML = `<span class="pf-hint">點這裡展開,紀錄今天的體重</span>`;
    }

  function setMetricsCollapsed(collapsed, persist){
    const sec = document.getElementById("metricsSection");
    if(!sec) return;
    sec.classList.toggle("collapsed", collapsed);
    const c = document.getElementById("mxCaret"); if(c) c.textContent = collapsed ? "▸" : "▾";
    updateMxMini();
    if(persist){ try{ window.storage.set(K("mxcollapsed"), collapsed?"1":"0", false); }catch(e){} }
  }
  function initMetricsCollapse(){
    const t = document.getElementById("mxToggle");
    if(t) t.addEventListener("click", ()=>{ const s=document.getElementById("metricsSection"); setMetricsCollapsed(!s.classList.contains("collapsed"), true); });
    const m = document.getElementById("mxMini");
    if(m) m.addEventListener("click", ()=> setMetricsCollapsed(false, true));
    (async()=>{
      let stored=null;
      try{ const c=await window.storage.get(K("mxcollapsed"),false); if(c && c.value!=null && c.value!=='') stored=c.value; }catch(e){}
      setMetricsCollapsed(stored==="1", false);
    })();
  }

  function drawChart(){
    const area = document.getElementById("chartArea");
    if(!log.length){
      area.innerHTML = '<div class="chart-empty">還沒有紀錄,量完體重後填上面表格就會畫出趨勢曲線囉</div>';
      document.getElementById("latestWeight").textContent = "--";
      return;
    }
    const sorted = [...log].sort((a,b)=>a.date.localeCompare(b.date));
    const latest = sorted[sorted.length-1];
    document.getElementById("latestWeight").textContent = latest.weight + "kg";

    const w=320,h=130,padX=8,padY=16;
    const values = sorted.map(p=>p.weight);
    const goal=60;
    const minV = Math.min(...values, goal) - 0.5;
    const maxV = Math.max(...values, goal) + 0.5;
    const n = sorted.length;
    function x(idx){ return n===1? w/2 : padX + (idx/(n-1))*(w-padX*2); }
    function y(v){ return h-padY - ((v-minV)/(maxV-minV))*(h-padY*2); }
    let path = sorted.map((p,idx)=>(idx===0?"M":"L")+x(idx).toFixed(1)+","+y(p.weight).toFixed(1)).join(" ");
    let dots = sorted.map((p,idx)=>`<circle cx="${x(idx).toFixed(1)}" cy="${y(p.weight).toFixed(1)}" r="4" fill="#D2B4B7" stroke="#fff" stroke-width="1.5"/>`).join("");
    const goalY = y(goal).toFixed(1);
    area.innerHTML = `
      <svg class="chart" viewBox="0 0 ${w} ${h}">
        <line x1="0" y1="${goalY}" x2="${w}" y2="${goalY}" stroke="#C3BDCB" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="4" y="${goalY-4}" font-size="14.3" fill="#A69C90">目標 60kg</text>
        <path d="${path}" fill="none" stroke="#D2B4B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}
      </svg>`;
  }

  function drawSnapshot(){
    const area = document.getElementById("snapshotArea");
    if(!log.length){ area.innerHTML=""; return; }
    const sorted = [...log].sort((a,b)=>a.date.localeCompare(b.date));
    const latest = sorted[sorted.length-1];
    area.innerHTML = `
      <div class="snapshot-row">
        <div class="chip pink"><div class="v">${latest.fat!=null && latest.fat!=='' ? latest.fat+'%':'--'}</div><div class="k">體脂率</div></div>
        <div class="chip"><div class="v">${latest.bmi!=null && latest.bmi!=='' ? latest.bmi:'--'}</div><div class="k">BMI</div></div>
        <div class="chip lav"><div class="v">${latest.muscle!=null && latest.muscle!=='' ? latest.muscle+'kg':'--'}</div><div class="k">肌肉重量</div></div>
      </div>`;
  }

  function drawHistory(){
    const area = document.getElementById("historyArea");
    if(!log.length){ area.innerHTML=""; return; }
    const sorted = [...log].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
    area.innerHTML = sorted.map(p=>{
      const d = new Date(p.date+"T00:00:00");
      return `<div class="history-row"><span>${fmtDate(d)}</span><span><b>${p.weight}kg</b>${p.fat? ' · 體脂 '+p.fat+'%':''}${p.muscle? ' · 肌肉 '+p.muscle+'kg':''}</span></div>`;
    }).join("");
  }

  document.getElementById("addWeightBtn").addEventListener("click", async ()=>{
    const w = parseFloat(document.getElementById("inWeight").value);
    if(isNaN(w) || w<=0) return;
    const fat = document.getElementById("inFat").value;
    const bmi = document.getElementById("inBmi").value;
    const muscle = document.getElementById("inMuscle").value;
    const todayIso = isoDate(today);
    const entry = { date:todayIso, weight:w,
      fat: fat!==""? parseFloat(fat): null,
      bmi: bmi!==""? parseFloat(bmi): null,
      muscle: muscle!==""? parseFloat(muscle): null };
    const idx = log.findIndex(p=>p.date===todayIso);
    if(idx>=0) log[idx]=entry; else log.push(entry);
    await saveLog();
    ["inWeight","inFat","inBmi","inMuscle"].forEach(id=>document.getElementById(id).value="");
    renderMetrics();
  });

  function hideSuggest(){ const b=document.getElementById("foodSuggest"); if(b){ b.className="food-suggest"; b.innerHTML=""; } }
  function renderSuggest(q){
    const box = document.getElementById("foodSuggest");
    if(!box) return;
    q = (q||"").trim();
    if(!q){ hideSuggest(); return; }
    const ql = q.toLowerCase(), seen = new Set();
    const list = foodCandidates().filter(f=>{
      if(seen.has(f.n)) return false; seen.add(f.n);
      return f.n.toLowerCase().indexOf(ql) >= 0;
    }).slice(0,8);
    if(!list.length){ hideSuggest(); return; }
    box.innerHTML = list.map(f=>`<div class="fs-item" data-n="${f.n}" data-k="${f.k}"><span>${f.n}</span><span class="fs-k">${f.k} kcal</span></div>`).join("");
    box.className = "food-suggest show";
    box.querySelectorAll(".fs-item").forEach(it=>{
      it.addEventListener("mousedown", (e)=>{
        e.preventDefault();
        document.getElementById("inFoodName").value = it.dataset.n;
        document.getElementById("inFoodKcal").value = it.dataset.k;
        hideSuggest();
      });
    });
  }

  // 依你今天吃多少 + 今天是重訓/燃脂/休息,動態給飲食或運動的調整建議
  function buildAdvice(todays, total){
    if(!todays.length){
      return `<div class="advice">先設好<b>今日目標 ${kcalTarget} kcal</b>,每吃一餐就記一下,我會即時幫你算還能吃多少、要不要加運動 💪</div>`;
    }
    const iso = isoDate(today);
    const dEntry = days.find(d=>d.iso===iso) || days[0];
    const wtype = dEntry.workout.type; // lift / cardio / rest
    const logged = new Set(todays.map(f=>f.meal));
    const remain = kcalTarget - total;
    const over = total - kcalTarget;

    if(over > 250){
      const burn = wtype==="rest"
        ? "今天是休息日,飯後快走 30 分鐘可多消耗約 120 kcal"
        : "今天有運動,收尾再加 15 分鐘跑步機間歇,可多消耗約 150 kcal";
      const cut = !logged.has("晚餐")
        ? "晚餐改成蛋白質+蔬菜、少澱粉(省下約 200 kcal)"
        : "明天早/午餐各少半碗飯,把今天補回來";
      return `<div class="advice over"><b>今天已超過目標 ${Math.round(over)} kcal。</b>選一個補救:<br>① ${cut}<br>② ${burn}</div>`;
    }
    if(over > 0){
      return `<div class="advice warn"><b>剛好超一點點(${Math.round(over)} kcal)。</b>接下來以蔬菜、無糖飲料為主,飯後散步一下就打平了 🙂</div>`;
    }
    let tip;
    if(!logged.has("晚餐") && remain < 350) tip = "晚餐吃清淡點(魚 / 雞胸 + 蔬菜),先別加澱粉";
    else if(!logged.has("晚餐")) tip = "晚餐可以正常吃:一份蛋白質 + 半碗飯 + 蔬菜";
    else tip = "額度還夠,但別特地補吃;想吃就選水果或無糖優格";
    return `<div class="advice"><b>還可以吃 ${Math.round(remain)} kcal,狀況很好 👍</b><br>${tip}</div>`;
  }

  function renderFoodLog(){
    const iso = isoDate(today);
    const todays = foodLog.filter(f=>f.date===iso);
    const total = todays.reduce((s,f)=>s + (Number(f.kcal)||0), 0);
    const over = total > kcalTarget;
    const pct = kcalTarget>0 ? Math.min(100, Math.round(total/kcalTarget*100)) : 0;

    document.getElementById("kcalSummary").innerHTML = `
      <div class="kcal-head">
        <div><span class="big">${Math.round(total)}</span> <span class="sub">/ ${kcalTarget} kcal</span></div>
        <div class="sub">${over ? '超過 '+Math.round(total-kcalTarget) : '還可吃 '+Math.round(kcalTarget-total)} kcal</div>
      </div>
      <div class="kcal-bar ${over?'over':''}"><span style="width:${pct}%"></span></div>`;

    document.getElementById("foodAdvice").innerHTML = buildAdvice(todays, total);

    const order = ["早餐","午餐","晚餐","點心","其他"];
    const groups = {};
    todays.forEach(f=>{ const m = order.includes(f.meal)? f.meal : "其他"; (groups[m]=groups[m]||[]).push(f); });
    const area = document.getElementById("foodLogArea");
    if(!todays.length){ area.innerHTML = `<div class="chart-empty">今天還沒紀錄,選一餐、輸入食物就會加進來囉</div>`; return; }
    area.innerHTML = order.filter(m=>groups[m]).map(m=>{
      const sub = groups[m].reduce((s,f)=>s+(Number(f.kcal)||0),0);
      const rows = groups[m].map(f=>`
        <div class="food-card" data-fid="${f.id}">
          ${f.thumb?`<img src="${f.thumb}">`:''}
          <div style="flex:1;">
            <div class="fc-name">${f.name}</div>
            <div class="fc-kcal">${f.kcal} kcal</div>
          </div>
          <div class="fc-del" data-fid="${f.id}">刪除</div>
        </div>`).join("");
      return `<div class="meal-group"><div class="meal-group-title">${m} · ${sub} kcal</div>${rows}</div>`;
    }).join("");
    area.querySelectorAll(".fc-del").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        foodLog = foodLog.filter(f=>f.id !== btn.dataset.fid);
        await saveFoodLog();
        renderFoodLog();
      });
    });
  }

  function resizeImageToBase64(file, maxSize){
    return new Promise((resolve,reject)=>{
      const img=new Image(), reader=new FileReader();
      reader.onload=()=>{ img.src=reader.result; }; reader.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){ if(w>maxSize){ h=h*maxSize/w; w=maxSize; } } else { if(h>maxSize){ w=w*maxSize/h; h=maxSize; } }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",0.7));
      };
      img.onerror=reject; reader.readAsDataURL(file);
    });
  }

  const GEMINI_MODELS = ["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-flash-latest","gemini-2.0-flash"];
  async function geminiJSON(prompt, extraParts, temp){
    const parts=[{text:prompt}]; if(extraParts) extraParts.forEach(p=>parts.push(p));
    const body = { contents:[{ parts }], generationConfig:{ responseMimeType:"application/json", temperature: temp==null?0.3:temp } };
    let lastMsg="連線失敗", quotaHit=false;
    for(let i=0;i<GEMINI_MODELS.length;i++){
      const url = "https://generativelanguage.googleapis.com/v1beta/models/"+GEMINI_MODELS[i]+":generateContent?key="+encodeURIComponent(geminiKey);
      let res;
      try{ res = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) }); }
      catch(netErr){ lastMsg="無法連線到 Google,請檢查網路"; continue; }
      if(res.ok){
        const data = await res.json();
        const rparts = ((((data.candidates||[])[0]||{}).content||{}).parts)||[];
        const txt = (rparts[0]||{}).text || "";
        try{ return JSON.parse(txt); }catch(e){ throw new Error("AI 回傳格式看不懂,請再試一次"); }
      }
      let msg="錯誤 "+res.status; const status=res.status;
      try{ const e=await res.json(); if(e.error&&e.error.message) msg=e.error.message; }catch(_){}
      lastMsg=msg;
      // 金鑰無效 / 沒開啟 API → 換模型也沒用,直接停
      if((status===400||status===403) && /API.?key|API_KEY_INVALID|PERMISSION|not valid|SERVICE_DISABLED|has not been used/i.test(msg)){
        throw new Error("金鑰無效或尚未啟用,請重新確認:"+msg);
      }
      if(status===429) quotaHit=true;   // 這個模型免費額度用完/歸零 → 換下一個
    }
    if(quotaHit) throw new Error("免費額度已用完或此金鑰暫無可用的免費模型,請稍後再試或明天再用(免費額度每天會重置)。");
    throw new Error(lastMsg);

  function analyzeProfile(){
    const sex = document.getElementById("pfSex").value;
    const age = parseFloat(document.getElementById("pfAge").value);
    const h   = parseFloat(document.getElementById("pfHeight").value);
    const w   = parseFloat(document.getElementById("pfWeight").value);
    const tw  = parseFloat(document.getElementById("pfTargetW").value);
    const tbf = document.getElementById("pfTargetBf").value;
    const dateStr = document.getElementById("pfDate").value;
    const box = document.getElementById("profileResult");

    if(!(age>0 && h>0 && w>0 && tw>0 && dateStr)){
      box.innerHTML = `<div class="advice">填好上面資料(性別、年齡、身高、目前 / 目標體重、達成日期),就會自動幫你算出每天該吃多少、預計多久達成,並套進下方的熱量目標 📊</div>`;
      return;
    }

    const bmr  = Math.round(10*w + 6.25*h - 5*age + (sex==="male"?5:-161));
    const tdee = Math.round(bmr * 1.45); // 有照計畫運動 → 輕度活動
    const proteinG = Math.round(tw * 1.6);
    const lose = w - tw;

    if(lose <= 0.05){
      kcalTarget = tdee; document.getElementById("inKcalTarget").value = tdee; saveTarget(); renderFoodLog();
      box.innerHTML = `
        <div class="snapshot-row">
          <div class="chip"><div class="v">${bmr}</div><div class="k">基礎代謝</div></div>
          <div class="chip pink"><div class="v">${tdee}</div><div class="k">每日消耗</div></div>
          <div class="chip lav"><div class="v">${tdee}</div><div class="k">每日建議吃</div></div>
        </div>
        <div class="advice"><b>你已經到目標附近了 🎉</b>以「維持」為主:吃到約 ${tdee} kcal、每天蛋白質約 ${proteinG}g,繼續重訓保住肌肉即可。</div>`;
      return;
    }

    const target = new Date(dateStr + "T00:00:00");
    const days = Math.round((target - today)/86400000);
    if(days < 1){
      box.innerHTML = `<div class="advice warn"><b>「達成日期」請選未來的日期喔</b>(今天是 ${fmtYMD(today)})。</div>`;
      return;
    }
    const weeks = days/7;
    const totalDeficit = lose * 7700; // 1kg 脂肪 ≈ 7700 kcal
    const dailyDeficit = totalDeficit / days;
    const minIntake = sex==="female" ? 1200 : 1500;

    let recommend = Math.round(tdee - dailyDeficit);
    let feasible = true, projStr = "";
    if(recommend < minIntake){
      feasible = false;
      recommend = minIntake;
      const safeDaily = Math.max(1, tdee - minIntake);
      const daysNeeded = Math.ceil(totalDeficit / safeDaily);
      projStr = fmtYMD(new Date(today.getTime() + daysNeeded*86400000));
    }
    const weeklyLoss = (tdee - recommend) * 7 / 7700;

    kcalTarget = recommend; document.getElementById("inKcalTarget").value = recommend; saveTarget(); renderFoodLog();

    let advice;
    if(feasible){
      advice = `<div class="advice"><b>每天吃約 ${recommend} kcal</b>(比每日消耗少 ${Math.round(dailyDeficit)}),照這樣大約 <b>${weeks.toFixed(1)} 週</b>後到 ${tw}kg。<br>
        · 蛋白質每天約 <b>${proteinG}g</b>,減脂時保住肌肉不鬆垮<br>
        · 運動照計畫:每週 3 次重訓拉高基礎代謝、3 次有氧幫燃脂<br>
        · 體脂目標 ${tbf?tbf+'%':'(可留空)'} 靠「重訓維持肌肉 + 飲食赤字」慢慢降</div>`;
    } else {
      advice = `<div class="advice warn"><b>這個時間有點趕</b>,要準時達成得每天吃不到 ${minIntake} kcal,太低不健康。<br>
        已幫你設在安全的 <b>${recommend} kcal/天</b>,每週約減 <b>${weeklyLoss.toFixed(1)}kg</b>,大約 <b>${projStr}</b> 能安全達成 ${tw}kg。想更快就多靠運動,別再壓低吃的量。</div>`;
    }

    box.innerHTML = `
      <div class="snapshot-row">
        <div class="chip"><div class="v">${bmr}</div><div class="k">基礎代謝</div></div>
        <div class="chip pink"><div class="v">${tdee}</div><div class="k">每日消耗</div></div>
        <div class="chip lav"><div class="v">${recommend}</div><div class="k">每日建議吃</div></div>
      </div>
      <div class="snapshot-row">
        <div class="chip"><div class="v">${weeklyLoss.toFixed(1)}kg</div><div class="k">每週約減</div></div>
        <div class="chip pink"><div class="v">${proteinG}g</div><div class="k">每日蛋白質</div></div>
        <div class="chip lav"><div class="v">${Math.max(0,lose).toFixed(1)}kg</div><div class="k">還要減</div></div>
      </div>
      ${advice}`;
  }

  let workoutPlan = null;
  function spreadDays(n){ const out=[]; for(let i=0;i<n;i++) out.push(Math.min(6, Math.round(i*7/n))); return out; }
  function localWorkoutPlan(days, cardioMin, note){
    days = Math.min(7, Math.max(1, days||4)); cardioMin = cardioMin||20;
    const parts = ["肩 · 直角肩","大腿內側 · 翹臀","手臂 · 拜拜肉","背 · 核心"];
    const dayNames = ["週一","週二","週三","週四","週五","週六","週日"];
    const trainDays = spreadDays(days); let li=0;
    const week=[];
    for(let i=0;i<7;i++){
      const ti = trainDays.indexOf(i);
      if(ti>=0){
        if(ti%2===0){
          const focus = parts[li%parts.length]; li++;
          week.push({ day:dayNames[i], type:"重訓", focus,
            items:["暖身 5 分鐘","主項:針對「"+focus+"」啞鈴動作 3-4 組 × 12-15 下","輔助動作 2-3 組","收操伸展 5 分鐘"] });
        } else {
          week.push({ day:dayNames[i], type:"有氧", focus:"燃脂",
            items:["跑步機間歇 / 快走 "+cardioMin+" 分鐘","全身燃脂:開合跳 / 高抬腿 / 深蹲跳 各 40 秒 × 3 輪"] });
        }
      } else {
        week.push({ day:dayNames[i], type:"休息", focus:"", items:["休息 / 輕鬆散步 / 伸展放鬆"] });
      }
    }
    const tips=["重訓後 30 分鐘內補充蛋白質","動作會痠是正常,關節會痛就停下","一週至少 2 天完全休息,肌肉才會長"];
    if(note) tips.unshift("你的偏好:"+note+"(內建版已盡量納入;貼上免費 AI 金鑰可產生更貼身的計畫)");
    return { summary:"依你選的每週 "+days+" 天、每次有氧約 "+cardioMin+" 分鐘:重訓與有氧交替、其餘休息。", week, tips };
  }

    try{ const r=await window.storage.get(K("waterlog"),false); if(r&&r.value) waterLog=JSON.parse(r.value)||{}; }catch(e){}
    try{ const g=await window.storage.get(K("watergoal"),false); if(g&&g.value){ const v=parseInt(g.value,10); if(v>0) waterGoal=v; } }catch(e){}
    const gi=document.getElementById("inWaterGoal"); if(gi) gi.value=waterGoal;
    renderWater();
  }
  async function saveWater(){ try{ await window.storage.set(K("waterlog"), JSON.stringify(waterLog), false); }catch(e){} }
  async function saveWaterGoal(){ try{ await window.storage.set(K("watergoal"), String(waterGoal), false); }catch(e){} }
  function renderWater(){
    const cEl=document.getElementById("waterCups"); if(!cEl) return;
    const cups = waterLog[isoDate(today)]||0;
    cEl.textContent = cups;
    document.getElementById("waterGoalNum").textContent = waterGoal;
    document.getElementById("waterMl").innerHTML = (cups*250) + " ml" + (cups>=waterGoal ? ' <b>✅ 達標!</b>' : '');
    const row=document.getElementById("waterCupsRow");
    const n=Math.max(waterGoal, cups); let h="";
    for(let i=0;i<n;i++) h+=`<span class="cup${i<cups?' full':''}"></span>`;
    row.innerHTML=h;
  }
  function changeWater(d){
    const iso=isoDate(today); let c=(waterLog[iso]||0)+d; if(c<0) c=0;
    waterLog[iso]=c; saveWater(); renderWater();
  }
  function initWaterModule(){
    const plus=document.getElementById("waterPlus"), minus=document.getElementById("waterMinus");
    if(plus) plus.addEventListener("click", ()=>changeWater(1));
    if(minus) minus.addEventListener("click", ()=>changeWater(-1));
    const gi=document.getElementById("inWaterGoal");
    if(gi) gi.addEventListener("change", async ()=>{ const v=parseInt(gi.value,10); if(v>0){ waterGoal=v; await saveWaterGoal(); renderWater(); } });
  }

  // ---------- 多計畫管理 ----------
  const PLAN_LABEL = { track:"飲食+喝水+體重", full:"減重規劃", origin:"完整計畫", weight:"飲食+喝水+體重", calorie:"飲食+喝水+體重" };
  async function loadPlans(){
    try{ const r=await window.storage.get("plans",false); if(r&&r.value) plans=JSON.parse(r.value)||[]; }catch(e){ plans=[]; }
    if(!plans.length) plans=[{id:"default",name:"減重計畫",type:"origin"}];
    const _d=plans.find(p=>p.id==="default"); if(_d && _d.name==="回台減重計畫"){ _d.name="減重計畫"; savePlans(); }
    let _mig=false; plans.forEach(p=>{ if(p.type==="weight"||p.type==="calorie"){ p.type="track"; _mig=true; } }); if(_mig) savePlans();
    let cur="default";
    try{ const c=await window.storage.get("currentplan",false); if(c&&c.value) cur=c.value; }catch(e){}
    PLAN = plans.find(p=>p.id===cur) || plans[0];
  }
  async function savePlans(){ try{ await window.storage.set("plans", JSON.stringify(plans), false); }catch(e){} }
  function updatePlanBar(){ const b=document.getElementById("planCurrent"); if(b) b.textContent = PLAN.name + " ▾"; }
  function applyPlanView(){
    const t = PLAN.type;
    const show=(id,v)=>{ const el=document.getElementById(id); if(el) el.style.display = v?"":"none"; };
    show('heroSection', t==='origin');
    show('menuSection', t==='origin');
    show('checkinSection', t==='origin');
    show('profileSection', t==='origin'||t==='full');
    show('workoutSection', t==='origin'||t==='full');
    show('foodSection', t==='origin'||t==='full'||t==='track');
    show('waterSection', t==='origin'||t==='full'||t==='track');
    show('metricsSection', true);
    const ph=document.getElementById("planHeader");
    if(ph){ if(t==='origin'){ ph.style.display="none"; } else { ph.style.display=""; ph.textContent=PLAN.name; } }
  }
  function renderPlanList(){
    const box=document.getElementById("planList"); if(!box) return;
    box.innerHTML = plans.map(p=>`<div class="plan-item ${p.id===PLAN.id?'active':''}" data-id="${p.id}">
        <span class="pi-name">${p.name}</span>
        <span class="pi-type">${PLAN_LABEL[p.type]||''}</span>
        <span class="pi-edit" data-edit="${p.id}">改名</span>
        ${p.id!=="default"?`<span class="pi-del" data-del="${p.id}">刪除</span>`:''}
      </div>`).join("");
    box.querySelectorAll(".plan-item").forEach(it=>{
      it.addEventListener("click",(e)=>{ if(e.target.classList.contains("pi-del")||e.target.classList.contains("pi-edit")) return;
        switchPlan(it.dataset.id); document.getElementById("planPanel").classList.remove("show"); });
    });
    box.querySelectorAll(".pi-edit").forEach(ed=>{
      ed.addEventListener("click", async (e)=>{ e.stopPropagation();
        const pl=plans.find(p=>p.id===ed.dataset.edit); if(!pl) return;
        const nn=prompt("計畫名稱:", pl.name);
        if(nn && nn.trim()){ pl.name=nn.trim(); await savePlans(); renderPlanList(); updatePlanBar(); applyPlanView(); }
      });
    });
    box.querySelectorAll(".pi-del").forEach(d=>{
      d.addEventListener("click", async (e)=>{ e.stopPropagation();
        if(!confirm("刪除這個計畫?裡面的紀錄也會一起清掉")) return;
        const id=d.dataset.del;
        ["metricslog","foodlog","kcaltarget","profile","pfcollapsed","mxcollapsed","waterlog","watergoal","workout","wocollapsed"].forEach(k=>{ try{ window.storage.set("p:"+id+":"+k,"",false);}catch(e){} });
        plans=plans.filter(p=>p.id!==id); await savePlans();
        if(PLAN.id===id){ await switchPlan("default"); } else { renderPlanList(); }
      });
    });
  }
  async function switchPlan(id){
    const pl=plans.find(p=>p.id===id); if(!pl) return;
    PLAN=pl; try{ await window.storage.set("currentplan", id, false); }catch(e){}
    updatePlanBar(); renderPlanList(); applyPlanView();
    await loadLog(); await loadFoodLog(); await loadWater(); await loadProfile(); await loadWorkout();
  }
  async function addPlan(){
    const nameEl=document.getElementById("newPlanName");
    const name=(nameEl.value||"").trim();
    const type=document.getElementById("newPlanType").value;
    if(!name){ nameEl.focus(); return; }
    const id="pl"+Date.now().toString(36);
    plans.push({id,name,type}); await savePlans();
    nameEl.value="";
    await switchPlan(id);
    document.getElementById("planPanel").classList.remove("show");
  }
  function initPlanModule(){
    updatePlanBar(); renderPlanList();
    document.getElementById("planCurrent").addEventListener("click", ()=> document.getElementById("planPanel").classList.toggle("show"));
    document.getElementById("addPlanBtn").addEventListener("click", addPlan);
  }

  async function init(){
    await loadPlans();
    initPlanModule();
    applyPlanView();
    await loadOverrides();
    renderTodayMenu();
    initMenuModule();
    await loadDoneState();
    await loadLog();
    initMetricsCollapse();
    initFoodModule();
    await loadFoodLog();
    initAIPhotoModule();
    await loadGeminiKey();
    initWaterModule();
    await loadWater();
    initProfileModule();
    await loadProfile();
    initWorkoutModule();
    await loadWorkout();
  }
  init();
})();
</script>
</body>
</html>
