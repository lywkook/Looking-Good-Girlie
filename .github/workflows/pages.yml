name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/photo-weight-input-fix-kfvr33"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Mirror app into /app (fresh, cache-busted share URL — auto-synced every deploy)
        run: |
          mkdir -p app
          cp index.html sw.js manifest.webmanifest app/
          cp -r assets app/assets
          # /app is the shared/blank build. Hardcode it blank so EVERY launch (browser,
          # cached, or home-screen PWA that dropped the ?blank query) is always the blank
          # version — no leftover template, nothing to delete by hand.
          sed -i 's#</head>#<script>window.__FORCE_BLANK=true;</script></head>#' app/index.html
          # Also make its PWA launch URL carry ?blank as a second safeguard.
          sed -i 's#"start_url": "./index.html"#"start_url": "./index.html?blank"#' app/manifest.webmanifest
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
